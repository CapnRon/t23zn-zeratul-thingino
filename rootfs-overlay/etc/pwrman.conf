# Power manager profiles
#   pir        - PIR wake only
#   pir_cloud  - PIR + vendor AJCloud P2P wake
#   pir_local  - PIR + local MCU dashboard wake
ENABLED=1
PROFILE=pir
MIN_AWAKE=60
IDLE_TIMEOUT=180
CHECK_INTERVAL=5

# Established TCP ports treated as active clients (hex, /proc/net/tcp):
# 80=http, 443=https, 554=rtsp, 8443=https-alt, 8000=alt
COUNT_PORTS="0050 01BB 022A 20FB 1F40"

# Wait for current clip to close at segment boundary before stopping rmr.
WAIT_SEGMENT_END=1
